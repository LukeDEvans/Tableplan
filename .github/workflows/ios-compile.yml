# Compile the native iOS app (unsigned) whenever native code changes, so a
# Swift error shows up on the PR instead of at TestFlight time. Needs no
# secrets. Runs on a macOS runner, which uses more GitHub Actions minutes than
# Linux, so it's limited to changes that can affect the native build.
name: iOS compile check

on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - "native-bridge.js"
      - "capacitor.config.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ios-*.yml"
      - "scripts/ios-*.sh"
  pull_request:
    paths:
      - "ios/**"
      - "native-bridge.js"
      - "capacitor.config.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ios-*.yml"
      - "scripts/ios-*.sh"
  workflow_dispatch:

jobs:
  compile:
    name: xcodebuild (unsigned)
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - name: Select Xcode 26+
        # App Store Connect only accepts builds made with the iOS 26 SDK or later
        # (Xcode 26+). Pick the newest Xcode 26+ installed on the runner.
        run: |
          ls -d /Applications/Xcode*.app || true
          XC=$(ls -d /Applications/Xcode_2[6-9]*.app /Applications/Xcode_[3-9]*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XC" ]; then echo "::error::No Xcode 26+ on this runner image"; exit 1; fi
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app + sync into iOS project
        run: npm run ios:sync

      - name: Archive (ad-hoc signed, as the TestFlight workflow does)
        # Same archive settings as ios-testflight.yml, so a PR proves the archive
        # step works and that the app + Share Extension keep their entitlements.
        # Only the App Store signing/upload (needs the API key) isn't covered.
        run: |
          set -o pipefail
          xcodebuild archive \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM=6RTNUZR7K5 \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=NO \
            PROVISIONING_PROFILE_SPECIFIER= \
            | tee "$RUNNER_TEMP/build.log" | grep -E "error:|\*\* ARCHIVE" || { tail -80 "$RUNNER_TEMP/build.log"; exit 1; }

      - name: Check the archive kept its entitlements
        run: bash scripts/ios-check-entitlements.sh "$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app"
