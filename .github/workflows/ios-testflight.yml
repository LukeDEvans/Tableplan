# Build the native iOS app on a GitHub-hosted Mac and upload it to TestFlight.
#
# Manual only: Actions → "iOS → TestFlight" → Run workflow. Works from the
# GitHub website or the GitHub mobile app, no Mac needed. Setup (one-time
# secrets) is in CAPACITOR.md → "TestFlight from GitHub Actions".
#
# Signing is fully automatic: xcodebuild authenticates with an App Store Connect
# API key (-allowProvisioningUpdates), so Apple creates and manages the
# distribution certificate and provisioning profile ("cloud signing"). Nothing
# is exported from a Mac.
name: iOS → TestFlight

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit to build (blank = the branch this run is started from)"
        required: false
        default: ""

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  testflight:
    name: build + upload
    runs-on: macos-26
    timeout-minutes: 60
    env:
      TEAM_ID: 6RTNUZR7K5 # also in ios/App/ExportOptions.plist
    steps:
      - name: Check secrets are set
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          missing=""
          [ -n "$ASC_KEY_ID" ] || missing="$missing ASC_KEY_ID"
          [ -n "$ASC_ISSUER_ID" ] || missing="$missing ASC_ISSUER_ID"
          [ -n "$ASC_KEY_P8" ] || missing="$missing ASC_KEY_P8"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing (see CAPACITOR.md → TestFlight from GitHub Actions)"
            exit 1
          fi

      - name: Select Xcode 26+
        # App Store Connect only accepts builds made with the iOS 26 SDK or later
        # (Xcode 26+). Pick the newest Xcode 26+ installed on the runner.
        run: |
          ls -d /Applications/Xcode*.app || true
          XC=$(ls -d /Applications/Xcode_2[6-9]*.app /Applications/Xcode_[3-9]*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XC" ]; then echo "::error::No Xcode 26+ on this runner image"; exit 1; fi
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version

      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Blank input → the branch picked in "Use workflow from". (It used to
          # default to main, so a run started from a branch silently built main.)
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build web app + sync into iOS project
        env:
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
        run: npm run ios:sync # vite build → dist, then cap sync (copies web assets + pod install)

      - name: Write App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          KEY="$RUNNER_TEMP/AuthKey.p8"
          # Accept either the raw .p8 text or a base64 of it.
          if printf '%s' "$ASC_KEY_P8" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s\n' "$ASC_KEY_P8" > "$KEY"
          else
            printf '%s' "$ASC_KEY_P8" | base64 --decode > "$KEY"
          fi
          echo "ASC_KEY_PATH=$KEY" >> "$GITHUB_ENV"

      - name: Pick build number
        # Must increase with every upload. A UTC timestamp always does, e.g.
        # 20260928.1845 (two components, each within Apple's limits).
        run: echo "BUILD_NUMBER=$(date -u +%Y%m%d.%H%M)" >> "$GITHUB_ENV"

      - name: Archive (ad-hoc signed)
        # Archive WITHOUT a real signature. With automatic signing, `xcodebuild archive`
        # signs for *development* first, which needs a development provisioning
        # profile, and that needs a registered device ("Your team has no devices
        # from which to generate a provisioning profile"). The export step below
        # does the real signing, for App Store distribution, which needs no devices.
        #
        # The archive is signed AD HOC ("-") rather than not at all: export reads each
        # binary's entitlements from its archived signature, so an unsigned archive
        # would ship without them (the keychain group the Share Extension reads the
        # receipt share token from). Ad hoc needs no certificate or profile.
        run: |
          set -o pipefail
          xcodebuild archive \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=NO \
            PROVISIONING_PROFILE_SPECIFIER= \
            | tee "$RUNNER_TEMP/archive.log" | grep -E "error:|\*\* ARCHIVE" \
            || { tail -80 "$RUNNER_TEMP/archive.log"; exit 1; }

      - name: Check the archive kept its entitlements
        run: bash scripts/ios-check-entitlements.sh "$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app"

      - name: Manual signing setup (when IOS_DIST_KEY is set)
        # Automatic cloud signing can't make profiles that include the App Group
        # (Luke, 2026-11-14). With the IOS_DIST_KEY secret (a PEM RSA private key),
        # scripts/ios-manual-signing.mjs keeps an Apple Distribution certificate
        # for that key and two "Live CI <bundle id>" App Store profiles current
        # through the API key, and they go into a throwaway keychain here.
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          IOS_DIST_KEY: ${{ secrets.IOS_DIST_KEY }}
        run: |
          if [ -z "$IOS_DIST_KEY" ]; then echo "No IOS_DIST_KEY: automatic signing."; exit 0; fi
          umask 077
          SIGN="$RUNNER_TEMP/signing"; mkdir -p "$SIGN"
          printf '%s\n' "$IOS_DIST_KEY" > "$SIGN/dist.key"
          DIST_KEY_PATH="$SIGN/dist.key" node scripts/ios-manual-signing.mjs "$SIGN" com.mrlukedevans.live com.mrlukedevans.live.ShareExtension
          /usr/bin/openssl x509 -inform DER -in "$SIGN/dist.cer" -out "$SIGN/dist.pem"
          P12PASS=$(/usr/bin/openssl rand -hex 16)
          /usr/bin/openssl pkcs12 -export -inkey "$SIGN/dist.key" -in "$SIGN/dist.pem" -out "$SIGN/dist.p12" -passout "pass:$P12PASS"
          KC="$RUNNER_TEMP/signing.keychain-db"; KCPASS=$(/usr/bin/openssl rand -hex 16)
          security create-keychain -p "$KCPASS" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KCPASS" "$KC"
          security import "$SIGN/dist.p12" -k "$KC" -P "$P12PASS" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPASS" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$SIGN"/*.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/"
          rm -f "$SIGN/dist.key" "$SIGN/dist.p12"
          echo "MANUAL_SIGNING=$SIGN" >> "$GITHUB_ENV"

      - name: Sign for App Store + upload to App Store Connect (TestFlight)
        # Signs with an Apple Distribution certificate and an App Store profile,
        # both created/managed by Apple via the API key (-allowProvisioningUpdates),
        # then uploads.
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          # Same options as the checked-in ExportOptions.plist, but upload
          # straight to App Store Connect instead of writing an .ipa.
          cp ios/App/ExportOptions.plist "$RUNNER_TEMP/ExportOptions.plist"
          plutil -replace destination -string upload "$RUNNER_TEMP/ExportOptions.plist"
          if [ -n "${MANUAL_SIGNING:-}" ]; then
            plutil -replace signingStyle -string manual "$RUNNER_TEMP/ExportOptions.plist"
            plutil -replace signingCertificate -string "Apple Distribution" "$RUNNER_TEMP/ExportOptions.plist"
            plutil -replace provisioningProfiles -json "$(cat "$MANUAL_SIGNING/profiles.json")" "$RUNNER_TEMP/ExportOptions.plist"
          fi
          # On failure, Apple's own error lines (and the distribution log's) are
          # re-posted as annotations: they're readable through the API, where a
          # cloud session can't download the raw job log (PAPERCUTS 2026-10-26).
          set -o pipefail
          LOG="$RUNNER_TEMP/export.log"
          if ! xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" 2>&1 | tee "$LOG"; then
            grep -iE "error|failed|reason|ITMS-|NSLocalizedDescription|NSLocalizedFailureReason" "$LOG" \
              | sed 's/%/%25/g' | tail -7 \
              | while IFS= read -r line; do echo "::error title=export::${line:0:900}"; done || true
            DIST=$(grep -oE '/[^ "]*\.xcdistributionlogs' "$LOG" | head -1 || true)
            if [ -n "$DIST" ] && [ -d "$DIST" ]; then
              grep -rhoiE "(Error Domain|NSLocalizedDescription|NSLocalizedFailureReason|NSLocalizedRecoverySuggestion|statusCode|ITMS-)[^<>]{0,400}" "$DIST" 2>/dev/null \
                | sed 's/%/%25/g' | awk '!seen[$0]++' | tail -9 \
                | while IFS= read -r line; do echo "::error title=distribution-log::${line:0:900}"; done || true
            fi
            exit 70
          fi

      - name: Summary
        run: |
          {
            echo "### Uploaded build $BUILD_NUMBER to TestFlight"
            echo ""
            echo "Commit: \`$(git rev-parse --short HEAD)\` ($(git log -1 --pretty=%s))"
            echo ""
            echo "App Store Connect processes it for ~5–15 min, then it appears in the TestFlight app."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove API key
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/AuthKey.p8"
          rm -rf "$RUNNER_TEMP/signing"
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
