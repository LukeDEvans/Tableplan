# Build the native iOS app on a GitHub-hosted Mac and upload it to TestFlight.
#
# Manual only: Actions → "iOS → TestFlight" → Run workflow. Works from the
# GitHub website or the GitHub mobile app, no Mac needed. Setup (one-time
# secrets) is in CAPACITOR.md → "TestFlight from GitHub Actions".
#
# Signing is fully automatic: xcodebuild authenticates with an App Store Connect
# API key (-allowProvisioningUpdates), so Apple creates and manages the
# distribution certificate and provisioning profile ("cloud signing"). Nothing
# is exported from a Mac.
name: iOS → TestFlight

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit to build"
        required: false
        default: main

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  testflight:
    name: build + upload
    runs-on: macos-15
    timeout-minutes: 60
    env:
      TEAM_ID: 6RTNUZR7K5 # also in ios/App/ExportOptions.plist
    steps:
      - name: Check secrets are set
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          missing=""
          [ -n "$ASC_KEY_ID" ] || missing="$missing ASC_KEY_ID"
          [ -n "$ASC_ISSUER_ID" ] || missing="$missing ASC_ISSUER_ID"
          [ -n "$ASC_KEY_P8" ] || missing="$missing ASC_KEY_P8"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing (see CAPACITOR.md → TestFlight from GitHub Actions)"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build web app + sync into iOS project
        env:
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
        run: npm run ios:sync # vite build → dist, then cap sync (copies web assets + pod install)

      - name: Write App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          KEY="$RUNNER_TEMP/AuthKey.p8"
          # Accept either the raw .p8 text or a base64 of it.
          if printf '%s' "$ASC_KEY_P8" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s\n' "$ASC_KEY_P8" > "$KEY"
          else
            printf '%s' "$ASC_KEY_P8" | base64 --decode > "$KEY"
          fi
          echo "ASC_KEY_PATH=$KEY" >> "$GITHUB_ENV"

      - name: Pick build number
        # Must increase with every upload. A UTC timestamp always does, e.g.
        # 20260928.1845 (two components, each within Apple's limits).
        run: echo "BUILD_NUMBER=$(date -u +%Y%m%d.%H%M)" >> "$GITHUB_ENV"

      - name: Archive
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild archive \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            | tee "$RUNNER_TEMP/archive.log" | grep -E "error:|\*\* ARCHIVE" \
            || { tail -80 "$RUNNER_TEMP/archive.log"; exit 1; }

      - name: Upload to App Store Connect (TestFlight)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          # Same options as the checked-in ExportOptions.plist, but upload
          # straight to App Store Connect instead of writing an .ipa.
          cp ios/App/ExportOptions.plist "$RUNNER_TEMP/ExportOptions.plist"
          plutil -replace destination -string upload "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Summary
        run: |
          {
            echo "### Uploaded build $BUILD_NUMBER to TestFlight"
            echo ""
            echo "Commit: \`$(git rev-parse --short HEAD)\` ($(git log -1 --pretty=%s))"
            echo ""
            echo "App Store Connect processes it for ~5–15 min, then it appears in the TestFlight app."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove API key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
