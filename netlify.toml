[build]
  command = "npm run build"
  publish = "dist"
  # Merging to main does NOT deploy by itself: production builds run only when the
  # commit message contains [deploy] (see scripts/netlify-ignore.sh, UNDEPLOYED.md).
  ignore = "bash scripts/netlify-ignore.sh"

[build.environment]
  # VAPID_CONTACT_EMAIL is a contact address, not a credential — it is embedded
  # in every web-push request's claims and appears in reference SQL in the repo.
  SECRETS_SCAN_OMIT_KEYS = "VAPID_CONTACT_EMAIL,WEEKLY_REVIEW_TO"

[dev]
  command = "vite --port 5174"
  targetPort = 5174
  port = 5173
  autoLaunch = false
  context = "production"

[functions]
  directory = "netlify/functions"

# ics-proxy imports the shared parser at calendar/ics.mjs — ensure it's bundled
# with the function regardless of the bundler's import tracing.
[functions."ics-proxy"]
  included_files = ["calendar/ics.mjs", "calendar/recurrence.js"]

# instacart-list imports the shared pure Instacart payload/response logic.
[functions."instacart-list"]
  included_files = ["instacart.js"]

# kokoro-tts imports the shared pure core (validation/chunking/voices/errors).
[functions."kokoro-tts"]
  included_files = ["kokoro-core.mjs"]

# tts-cache-cleanup imports the sweep + voice/key modules; bundle them + run weekly.
[functions."tts-cache-cleanup"]
  schedule = "0 9 * * 0"
  included_files = ["tts-cache-sweep.mjs", "tts-article-text.mjs", "tts-cache-identity.js", "kokoro-core.mjs", "voice-prefs.js", "voice-registry.js", "tts-provider.js", "article-body-backfill.mjs"]

# Pre-synthesis: a tiny cron fires the 15-min background worker every couple of
# hours, which renders the newest unread articles into the audio cache (instant
# playback). Every 2h (was 4h) so a freshly-saved article is pre-rendered sooner;
# the worker is idempotent (already-rendered chunks are a free Storage check — no
# box call), so a tighter cadence stays free on the self-hosted Kokoro box.
[functions."presynth-cron"]
  schedule = "0 */2 * * *"

[functions."presynth-tts-background"]
  included_files = ["tts-article-text.mjs", "kokoro-core.mjs", "tts-cache-identity.js", "kokoro-store.mjs", "voice-prefs.js", "voice-registry.js", "tts-provider.js", "article-body-backfill.mjs"]

[functions."scheduled-email"]
  schedule = "*/15 * * * *"

# daily-briefing + simplefin ingest bank pulls into the durable transaction store
# via _finance-ingest.js, which dynamically imports the shared pure module.
[functions."daily-briefing"]
  schedule = "0 13 * * *"
  included_files = ["finance-transactions.js"]

[functions."simplefin"]
  included_files = ["finance-transactions.js"]

[functions."gmail-watch-rearm"]
  schedule = "0 11 * * *"

[functions."recipe-digest"]
  schedule = "0 15 * * 0"

# News: every section feed of the papers you're signed in to, hourly at :07
# (_news-feeds.js, NEWS_PAGE_DESIGN.md §10). Bounded single pass, insert-only.
[functions."news-feeds"]
  schedule = "7 * * * *"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000"

[[redirects]]
  from = "/api/push-subscribe"
  to = "/.netlify/functions/push-subscribe"
  status = 200

[[redirects]]
  from = "/api/check-hcl"
  to = "/.netlify/functions/check-hcl"
  status = 200

[[redirects]]
  from = "/api/voice-command"
  to = "/.netlify/functions/voice-command"
  status = 200

[[redirects]]
  from = "/api/admin-data"
  to = "/.netlify/functions/admin-data"
  status = 200

[[redirects]]
  from = "/api/auto-tag-grocery"
  to = "/.netlify/functions/auto-tag-grocery"
  status = 200

[[redirects]]
  from = "/api/weekly-email"
  to = "/.netlify/functions/weekly-email"
  status = 200

[[redirects]]
  from = "/api/email-interview"
  to = "/.netlify/functions/email-interview"
  status = 200

[[redirects]]
  from = "/data/*"
  to = "/index.html"
  status = 404

[[redirects]]
  from = "/server.js"
  to = "/index.html"
  status = 404

[[redirects]]
  from = "/*.sql"
  to = "/index.html"
  status = 404

# chat imports the shared assistant tool registry (also used by app.js).
[functions."chat"]
  included_files = ["assistant-tools.js"]

# voice-command (Siri → the assistant) dynamically imports the shared tool
# registry, grocery stamps and assistant memory from the repo root.
[functions."voice-command"]
  included_files = ["assistant-tools.js", "assistant-memory.js", "grocery-list-stamps.js"]
