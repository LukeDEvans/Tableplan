[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # VAPID_CONTACT_EMAIL is a contact address, not a credential — it is embedded
  # in every web-push request's claims and appears in reference SQL in the repo.
  SECRETS_SCAN_OMIT_KEYS = "VAPID_CONTACT_EMAIL,WEEKLY_REVIEW_TO"

[dev]
  command = "vite --port 5174"
  targetPort = 5174
  port = 5173
  autoLaunch = false
  context = "production"

[functions]
  directory = "netlify/functions"

# ics-proxy imports the shared parser at calendar/ics.mjs — ensure it's bundled
# with the function regardless of the bundler's import tracing.
[functions."ics-proxy"]
  included_files = ["calendar/ics.mjs"]

# kokoro-tts imports the shared pure core (validation/chunking/voices/errors).
[functions."kokoro-tts"]
  included_files = ["kokoro-core.mjs"]

# tts-cache-cleanup imports the sweep + voice/key modules; bundle them + run weekly.
[functions."tts-cache-cleanup"]
  schedule = "0 9 * * 0"
  included_files = ["tts-cache-sweep.mjs", "tts-article-text.mjs", "tts-cache-identity.js", "kokoro-core.mjs", "voice-prefs.js", "voice-registry.js", "tts-provider.js"]

# Pre-synthesis: a tiny cron fires the 15-min background worker every few hours,
# which renders the newest unread articles into the audio cache (instant playback).
[functions."presynth-cron"]
  schedule = "0 */4 * * *"

[functions."presynth-tts-background"]
  included_files = ["tts-article-text.mjs", "kokoro-core.mjs", "tts-cache-identity.js", "kokoro-store.mjs", "voice-prefs.js", "voice-registry.js", "tts-provider.js"]

[functions."scheduled-email"]
  schedule = "*/15 * * * *"

[functions."daily-briefing"]
  schedule = "0 13 * * *"

[functions."gmail-watch-rearm"]
  schedule = "0 11 * * *"

[functions."recipe-digest"]
  schedule = "0 15 * * 0"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000"

[[redirects]]
  from = "/api/push-subscribe"
  to = "/.netlify/functions/push-subscribe"
  status = 200

[[redirects]]
  from = "/api/check-hcl"
  to = "/.netlify/functions/check-hcl"
  status = 200

[[redirects]]
  from = "/api/voice-command"
  to = "/.netlify/functions/voice-command"
  status = 200

[[redirects]]
  from = "/api/admin-data"
  to = "/.netlify/functions/admin-data"
  status = 200

[[redirects]]
  from = "/api/auto-tag-grocery"
  to = "/.netlify/functions/auto-tag-grocery"
  status = 200

[[redirects]]
  from = "/api/weekly-email"
  to = "/.netlify/functions/weekly-email"
  status = 200

[[redirects]]
  from = "/api/email-interview"
  to = "/.netlify/functions/email-interview"
  status = 200

[[redirects]]
  from = "/data/*"
  to = "/index.html"
  status = 404

[[redirects]]
  from = "/server.js"
  to = "/index.html"
  status = 404

[[redirects]]
  from = "/*.sql"
  to = "/index.html"
  status = 404
