<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadence Lab</title>
  <style>
    :root{ --bg:#eef1f5; --surface:#fff; --ink:#161a22; --muted:#586072; --line:#d3dae3; --accent:#28407a; --good:#2f7d55; --warn:#8f6413; --crit:#b23a3a; }
    @media (prefers-color-scheme:dark){ :root{ --bg:#12151b; --surface:#181c24; --ink:#e7ebf2; --muted:#9aa4b5; --line:#2b3240; --accent:#88a2e0; --good:#5cae82; --warn:#cc9a4a; --crit:#d9736f; } }
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,sans-serif}
    header{position:sticky;top:0;z-index:10;background:var(--surface);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
    h1{font-size:16px;margin:0 12px 0 0;font-weight:700}
    .ctl{display:flex;gap:8px;align-items:center}
    button,label.filebtn,select{font:inherit;padding:6px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);cursor:pointer}
    button:hover,label.filebtn:hover{border-color:var(--accent)}
    button:disabled{opacity:.5;cursor:default}
    input[type=file]{display:none}
    .readouts{display:flex;flex-wrap:wrap;gap:8px 18px;padding:10px 16px;font:13px/1.4 ui-monospace,Menlo,monospace;color:var(--muted);border-bottom:1px solid var(--line);background:var(--surface)}
    .readouts b{color:var(--ink)}
    .pill{padding:1px 8px;border-radius:999px;border:1px solid var(--line)}
    .pill.ok{color:var(--good);border-color:var(--good)} .pill.warn{color:var(--warn);border-color:var(--warn)} .pill.err{color:var(--crit);border-color:var(--crit)}
    #score{background:var(--surface);margin:16px;border:1px solid var(--line);border-radius:10px;padding:8px;max-height:72vh;overflow:auto;cursor:crosshair}
    #score svg{max-width:100%}
    #log{margin:0 16px 16px;font:12px/1.5 ui-monospace,Menlo,monospace;color:var(--muted);white-space:pre-wrap;max-height:140px;overflow:auto}
    .empty{color:var(--muted);padding:40px;text-align:center}
  </style>
</head>
<body>
  <header>
    <h1>Cadence Lab</h1>
    <div class="ctl">
      <label class="filebtn">Import MusicXML…<input type="file" id="file" accept=".xml,.musicxml,.mxl"></label>
      <button id="sample">Load sample</button>
    </div>
    <div class="ctl">
      <select id="mode"><option value="continuous">Continuous scroll</option><option value="paged">Paged</option></select>
    </div>
    <div class="ctl">
      <button id="reload" disabled>Reload from storage (offline)</button>
      <button id="clear">Clear storage</button>
    </div>
  </header>
  <div class="readouts">
    <span>state: <b id="rState">—</b></span>
    <span>tpq: <b id="rTpq">—</b></span>
    <span>measures: <b id="rMeasures">—</b></span>
    <span>notes resolved: <b id="rNotes">—</b></span>
    <span>warnings: <b id="rWarn">—</b></span>
    <span>click → position: <b id="rPos">tap a note</b></span>
  </div>
  <div id="score"><div class="empty">Import a MusicXML file (or “Load sample”) to render.</div></div>
  <div id="log"></div>
  <script type="module" src="/music-lab.js"></script>
</body>
</html>
